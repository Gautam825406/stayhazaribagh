services:
  - type: web
    name: stayhazaribagh-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://stayhazaribagh.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: stayhazaribagh-db
          property: connectionString

databases:
  - name: stayhazaribagh-db
    plan: free
